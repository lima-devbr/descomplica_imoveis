<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado! — Descomplica Imóveis</title>
    <link rel="icon" href="assets/img/icons/fivicon/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #001F3F;
            --gold: #C9A96E;
            --gold-dark: #c9a800;
            --gold-muted: rgba(201,169,110,0.12);
            --bg: #020e1d;
            --text: #e8edf5;
            --gray: #a0aab8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Manrope', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background decorativo */
        .bg-deco {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 40%, rgba(201,169,110,0.06) 0%, transparent 65%),
                radial-gradient(ellipse at 10% 80%, rgba(0,31,63,0.6) 0%, transparent 50%),
                linear-gradient(160deg, #020e1d 0%, #001830 60%, #000d1a 100%);
            z-index: 0;
        }

        /* Círculos pulsantes */
        .ring {
            position: fixed;
            border-radius: 50%;
            border: 1px solid rgba(201,169,110,0.07);
            animation: pulse 5s ease-in-out infinite;
            z-index: 0;
        }

        .ring-1 {
            width: 500px; height: 500px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 0s;
        }

        .ring-2 {
            width: 750px; height: 750px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 1s;
            border-color: rgba(201,169,110,0.04);
        }

        .ring-3 {
            width: 1000px; height: 1000px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 2s;
            border-color: rgba(201,169,110,0.025);
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.04); opacity: 0.5; }
        }

        /* Partículas */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            animation: float-up linear infinite;
        }

        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Card central */
        .card {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 4rem 3rem;
            max-width: 560px;
            width: 90%;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(201,169,110,0.15);
            border-radius: 2rem;
            backdrop-filter: blur(12px);
            animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Ícone de check */
        .check-wrap {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            position: relative;
        }

        .check-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--gold-muted);
            border: 2px solid rgba(201,169,110,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pop 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
        }

        @keyframes pop {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .check-circle svg {
            width: 36px;
            height: 36px;
            stroke: var(--gold);
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .checkmark {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: draw 0.5s ease 1.1s forwards;
        }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }

        /* Tag */
        .tag {
            display: inline-block;
            color: var(--gold);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeIn 0.5s ease 0.8s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        h1 {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            color: #fff;
            line-height: 1.2;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeIn 0.5s ease 1s forwards;
        }

        h1 span { color: var(--gold); }

        .subtitle {
            color: var(--gray);
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeIn 0.5s ease 1.1s forwards;
        }

        /* Info row */
        .info-row {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeIn 0.5s ease 1.2s forwards;
        }

        .info-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--gold-muted);
            border: 1px solid rgba(201,169,110,0.2);
            border-radius: 2rem;
            padding: 0.45rem 1rem;
            font-size: 0.82rem;
            color: var(--text);
        }

        .info-pill span:first-child { font-size: 1rem; }

        /* Botões */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            opacity: 0;
            animation: fadeIn 0.5s ease 1.3s forwards;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 1rem 2rem;
            background: var(--gold);
            color: #000;
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: 3rem;
            text-decoration: none;
            transition: all 0.25s;
            box-shadow: 0 4px 20px rgba(201,169,110,0.2);
            font-family: 'Manrope', sans-serif;
        }

        .btn-primary:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(201,169,110,0.35);
        }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.9rem 2rem;
            border: 1.5px solid rgba(201,169,110,0.3);
            color: var(--gold);
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 3rem;
            text-decoration: none;
            transition: all 0.25s;
        }

        .btn-outline:hover {
            border-color: var(--gold);
            background: var(--gold-muted);
            transform: translateY(-2px);
        }

        /* Logo no topo */
        .logo-top {
            position: fixed;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        .logo-top img {
            height: 48px;
        }

        /* Rodapé minimalista */
        .foot {
            position: fixed;
            bottom: 1.2rem;
            left: 0; right: 0;
            text-align: center;
            color: rgba(160,170,184,0.5);
            font-size: 0.78rem;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="bg-deco"></div>
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>

    <!-- Partículas geradas via JS -->
    <div class="particles" id="particles"></div>

    <div class="logo-top">
        <img src="assets/img/logo-descomplica.png" alt="Descomplica Imóveis">
    </div>

    <div class="card">
        <div class="check-wrap">
            <div class="check-circle">
                <svg viewBox="0 0 24 24">
                    <polyline class="checkmark" points="4,13 9,18 20,7"/>
                </svg>
            </div>
        </div>

        <span class="tag">✦ Mensagem recebida</span>
        <h1>Obrigado pelo <span>contato!</span></h1>
        <p class="subtitle">
            Recebemos sua mensagem e em breve um dos nossos corretores vai entrar em contato com você. 
            Fique de olho no WhatsApp!
        </p>

        <div class="info-row">
            <div class="info-pill">
                <span>⚡</span>
                <span>Resposta rápida</span>
            </div>
            <div class="info-pill">
                <span>🔒</span>
                <span>Seus dados protegidos</span>
            </div>
        </div>

        <div class="btn-group">
            <a href="https://wa.me/5521969097890?text=Olá!%20Acabei%20de%20enviar%20uma%20mensagem%20pelo%20site." target="_blank" class="btn-primary">

                Falar no WhatsApp agora
            </a>
            <a href="index.html" class="btn-outline">
                ← Voltar para o início
            </a>
        </div>
    </div>

    <p class="foot">© 2025 Descomplica Imóveis</p>

    <script>
        // Gera partículas douradas flutuantes
        const container = document.getElementById('particles');
        const count = 18;

        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.width = (Math.random() * 3 + 2) + 'px';
            p.style.height = p.style.width;
            p.style.animationDuration = (Math.random() * 8 + 6) + 's';
            p.style.animationDelay = (Math.random() * 8) + 's';
            p.style.opacity = Math.random() * 0.5;
            container.appendChild(p);
        }
    </script>

</body>
</html>
